name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# 镜像推送到阿里云容器镜像服务 ACR（个人版）
# 登录账号 nick1901873567；密码需先在仓库 Settings → Secrets and variables → Actions
# 中新增 Secret：ALIYUN_ACR_PASSWORD
# （阿里云控制台 → 容器镜像服务 → 访问凭证 → 设置固定密码 / 使用账号密码）
# 镜像推送到 <ACR_NAMESPACE>/<frontend|backend>:<tag>
# 例如 crpi-...aliyuncs.com/geekpark-test/frontend:latest
env:
  ACR_REGISTRY: crpi-sf6d3yw2nfnffiwh.cn-beijing.personal.cr.aliyuncs.com
  ACR_NAMESPACE: geekpark-test
  ACR_USERNAME: nick1901873567

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: Dockerfile
          - name: backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 阿里云 ACR 个人版不接受 buildx 默认附带的 OCI 空清单
          # （application/vnd.oci.empty.v1+json），会报 unknown manifest class，故关闭 provenance
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
