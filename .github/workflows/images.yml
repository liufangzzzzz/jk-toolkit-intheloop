name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: Dockerfile
          - name: backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 金山云镜像仓库：需先在仓库 Settings → Secrets and variables → Actions 配置
      # KCE_USERNAME / KCE_PASSWORD（金山云控制台「镜像仓库 → 访问凭证」处设置）
      - name: Login to KCE (金山云)
        uses: docker/login-action@v3
        with:
          registry: hub.kce.ksyun.com
          username: ${{ secrets.KCE_USERNAME }}
          password: ${{ secrets.KCE_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/geekpark-hub/jk-toolkit-intheloop/${{ matrix.name }}
            hub.kce.ksyun.com/geekpark-hub/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
